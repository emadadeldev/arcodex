  <script>
    (() => {
      "use strict";

      const gamesGrid = document.getElementById("gamesGrid");

      const BASE_URL = new URL("./", window.location.href);
      const INDEX_URL = new URL("games/index.md", BASE_URL);

      async function fetchText(url) {
        const response = await fetch(url, {
          cache: "default",
        });

        if (!response.ok) {
          throw new Error(
            `فشل تحميل الملف (HTTP ${response.status}): ${url.href}`,
          );
        }

        return response.text();
      }

      async function discoverGames() {
        const markdown = await fetchText(INDEX_URL);

        return markdown
          .replace(/^\uFEFF/, "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => /^-\s+.+\.md$/i.test(line))
          .map((line) => line.replace(/^-\s+/, "").trim())
          .filter(
            (filename) =>
              !filename.includes("/") &&
              !filename.includes("\\") &&
              filename.toLowerCase() !== "index.md",
          );
      }

      function parseGameMarkdown(markdown) {
        const match = markdown
          .replace(/^\uFEFF/, "")
          .match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);

        if (!match) {
          throw new Error(
            "لم يتم العثور على YAML في بداية ملف Markdown. يجب أن يبدأ الملف بـ ---",
          );
        }

        if (!window.jsyaml) {
          throw new Error("مكتبة js-yaml لم يتم تحميلها.");
        }

        let data;

        try {
          data = window.jsyaml.load(match[1]);
        } catch (error) {
          throw new Error(`خطأ في تنسيق YAML: ${error.message}`);
        }

        if (!data || typeof data !== "object" || Array.isArray(data)) {
          throw new Error("بيانات اللعبة غير صحيحة.");
        }

        return data;
      }

      function getPlatforms(data) {
        const platforms =
          data.port ?? data.ports ?? data.platforms ?? data.platform ?? [];

        return Array.isArray(platforms)
          ? platforms.join(" / ")
          : String(platforms || "");
      }

      async function fetchGame(filename) {
        const fileURL = new URL(
          "games/" + encodeURIComponent(filename),
          BASE_URL,
        );

        const markdown = await fetchText(fileURL);
        const data = parseGameMarkdown(markdown);
        const slug = filename.replace(/\.md$/i, "");

        const coverPath =
          data.cover || data.image || data.poster || "assets/logo.png";

        return {
          slug: data.slug || slug,
          title: data.title || slug,
          cover: new URL(coverPath, BASE_URL).href,
          platforms: getPlatforms(data),
        };
      }

      function createGameCard(game) {
        const card = document.createElement("a");
        card.className = "game-card";

        const gameURL = new URL("game.html", BASE_URL);
        gameURL.search = "?=" + encodeURIComponent(game.slug);
        card.href = gameURL.href;

        const poster = document.createElement("div");
        poster.className = "poster";

        const image = document.createElement("img");
        image.src = game.cover;
        image.alt = game.title;
        image.loading = "lazy";
        image.decoding = "async";

        image.addEventListener("error", () => {
          if (!image.dataset.fallback) {
            image.dataset.fallback = "true";
            image.src = new URL("assets/logo.png", BASE_URL).href;
          }
        });

        const port = document.createElement("span");
        port.className = "port";
        port.textContent = game.platforms;

        poster.append(image, port);

        const info = document.createElement("div");
        info.className = "game-info";

        const heading = document.createElement("h3");
        heading.textContent = game.title;

        info.appendChild(heading);
        card.append(poster, info);

        return card;
      }

      async function loadGames() {
        if (!gamesGrid) {
          console.error('[ARCODEX] العنصر "#gamesGrid" غير موجود في HTML.');
          return;
        }

        try {
          const files = await discoverGames();

          if (files.length === 0) {
            gamesGrid.textContent =
              "لا توجد تعريبات متاحة حاليًا.";
            return;
          }

          const cards = new Array(files.length);
          const errors = [];

          await Promise.all(
            files.map(async (filename, index) => {
              try {
                const game = await fetchGame(filename);
                const card = createGameCard(game);

                cards[index] = card;

                const nextCard = cards.slice(index + 1).find(Boolean);

                if (nextCard) {
                  gamesGrid.insertBefore(card, nextCard);
                } else {
                  gamesGrid.appendChild(card);
                }
              } catch (error) {
                errors.push({
                  index,
                  filename,
                  message: error?.message || String(error),
                });

                console.error(
                  `[ARCODEX] فشل تحميل ${filename}:`,
                  error,
                );
              }
            }),
          );

          if (errors.length > 0) {
            errors.sort((a, b) => a.index - b.index);

            const error = document.createElement("p");
            error.className = "api-error";
            error.style.whiteSpace = "pre-wrap";
            error.textContent =
              "تعذر تحميل بعض الألعاب:\n\n" +
              errors
                .map((item) => `${item.filename}: ${item.message}`)
                .join("\n\n");

            gamesGrid.appendChild(error);
          }

        } catch (error) {
          console.error("[ARCODEX]", error);

          const errorMessage = document.createElement("p");
          errorMessage.className = "api-error";
          errorMessage.textContent =
            "تعذر تحميل قائمة التعريبات. يرجى المحاولة لاحقًا.";

          gamesGrid.replaceChildren(errorMessage);
        }
      }

      document.addEventListener("DOMContentLoaded", loadGames, {
        once: true,
      });

    })();
  </script>
