<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCODEX - Emad Adel</title>
    <link rel="preload" href="/api/database.json" as="fetch" crossorigin>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo">
                AR<span>CODEX</span>
            </a>
            <nav class="nav">
                <a href="#">التعريبات</a>
                <a href="#">طلب تعريب</a>
            </nav>
        </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="container">

        <section class="search-section">

            <h1>
                ARCODEX
                <span>نصوص عربية</span>
            </h1>

            <p class="subtitle">
               تعريبات
            </p>

        </section>

    <!-- ================= POPULAR ================= -->

        <section class="game-section">

            <div class="section-title">

                <h2>
                    التعريبات
                </h2>

            </div>


            <div class="games-grid" id="gamesGrid"></div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="copyright">
            © 2026 ARCODEX. All rights reserved.
        </div>

    </footer>



<script>
(() => {
    const gamesGrid = document.getElementById("gamesGrid");

    const escapeHTML = text => {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    };

    async function loadGames() {
        try {
            const response = await fetch("api.json", {
                cache: "force-cache"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const games = await response.json();

            if (!Array.isArray(games) || !games.length) {
                throw new Error("Empty API");
            }

            const fragment = document.createDocumentFragment();

            for (const game of games) {
                const ports = Array.isArray(game.port)
                    ? game.port.join(" / ")
                    : "";

                const card = document.createElement("article");
                card.className = "game-card";

                card.innerHTML = `
                    <div class="poster">
                        <img
                            src="${escapeHTML(game.cover)}"
                            alt="${escapeHTML(game.title)}"
                            loading="lazy"
                            decoding="async"
                        >

                        <span class="port">${escapeHTML(ports)}</span>
                    </div>

                    <div class="game-info">
                        <h3>${escapeHTML(game.title)}</h3>

                        <p class="game-description">
                            ${escapeHTML(game.Description)}
                        </p>
                    </div>
                `;

                fragment.appendChild(card);
            }

            gamesGrid.replaceChildren(fragment);

        } catch (error) {
            console.error("API:", error);

            gamesGrid.innerHTML = `
                <div class="api-error">
                    لا توجد تعريبات متاحة حالياً.
                    يرجى المحاولة لاحقاً.
                </div>
            `;
        }
    }

    loadGames();
})();
</script>


</body>
</html>
