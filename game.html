<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =====================================================
        SEO
    ===================================================== -->

    <title>ARCODEX</title>

    <meta
        name="description"
        content="ARCODEX - Emad Adel تعريبات الألعاب ومشاريع التعريب العربية."
    >

    <meta
        name="keywords"
        content="ARCODEX,Emad Adel, تعريبات, تعريب ألعاب, ترجمة ألعاب, ألعاب عربية"
    >

    <meta
        name="author"
        content="Emad Adel"
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="language"
        content="Arabic"
    >

    <!-- =====================================================
        CANONICAL
    ===================================================== -->

    <link
        rel="canonical"
        href="https://emadadeldev.github.io/arcodex/game.html"
    >

    <!-- =====================================================
        OPEN GRAPH
    ===================================================== -->

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="ARCODEX"
    >

    <meta
        property="og:locale"
        content="ar_AR"
    >

    <meta
        property="og:title"
        content="ARCODEX"
    >

    <meta
        property="og:description"
        content="تعريبات الألعاب ومشاريع التعريب العربية."
    >

    <meta
        property="og:url"
        content="https://emadadeldev.github.io/arcodex/game.html"
    >

    <meta
        property="og:image"
        content="https://emadadeldev.github.io/arcodex/assets/logo.png"
    >

    <meta
        property="og:image:alt"
        content="ARCODEX"
    >

    <!-- =====================================================
        TWITTER / X
    ===================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="ARCODEX"
    >

    <meta
        name="twitter:description"
        content="تعريبات الألعاب ومشاريع التعريب العربية."
    >

    <meta
        name="twitter:image"
        content="https://emadadeldev.github.io/arcodex/assets/logo.png"
    >

    <meta
        name="twitter:image:alt"
        content="ARCODEX"
    >

    <!-- =====================================================
        FONTS
    ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
        DATABASE
    ===================================================== -->

    <link
        rel="preload"
        href="api/database.json"
        as="fetch"
    >

    <!-- =====================================================
        CSS
    ===================================================== -->

    <link
        rel="stylesheet"
        href="assets/style.css"
    >

    <!-- =====================================================
        STRUCTURED DATA
    ===================================================== -->

    <script
        id="game-schema"
        type="application/ld+json"
    >
    {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "ARCODEX",
        "description": "تعريبات الألعاب ومشاريع التعريب العربية.",
        "url": "https://emadadeldev.github.io/arcodex/game.html",
        "image": "https://emadadeldev.github.io/arcodex/assets/logo.png",
        "inLanguage": "ar"
    }
    </script>

</head>


<body class="game-page">

    <!-- =====================================================
        BLURRED GAME BACKGROUND
    ===================================================== -->

    <div
        class="game-background"
        aria-hidden="true"
    >

        <div class="game-background-image"></div>

        <div class="game-background-overlay"></div>

    </div>


    <!-- =====================================================
        HEADER
    ===================================================== -->

    <header class="header">

        <div class="header-inner">

            <a
                href="https://emadadeldev.github.io/arcodex"
                class="logo"
            >
                AR<span>CODEX</span>
            </a>

            <div class="account">

                <a
                    href="https://emadadeldev.github.io/arcodex"
                >
                    التعريبات
                </a>

                <span>|</span>

                <a href="donate.html">
                    الدعم المادي
                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
        GAME
    ===================================================== -->

    <main class="game-container">

        <!-- ================= TITLE ================= -->

        <section class="game-heading">

            <h1>
                تحميل...
            </h1>

            <div class="developer">
                تحميل...
            </div>

            <div class="genres"></div>

        </section>


        <!-- ================= MAIN GAME INFO ================= -->

        <section class="game-main">

            <!-- ================= POSTER ================= -->

            <div class="poster-column">

                <div class="poster">

                    <img
                        src=""
                        alt=""
                    >

                </div>

            </div>


            <!-- ================= DETAILS ================= -->

            <div class="game-details">

                <div class="description">
                    تحميل...
                </div>

                <div class="social-links"></div>

                <div class="download-actions">

                    <!-- DOWNLOAD -->

                    <button
                        class="download-button"
                        type="button"
                    >
                        تنزيل
                    </button>

                    <!-- SHARE -->

                    <button
                        class="magnet-button"
                        type="button"
                    >
                        مشاركة
                    </button>

                    <!-- LIKE -->

                    <button
                        class="like-button"
                        type="button"
                        aria-label="إعجاب"
                    >

                        <span class="like-icon">
                            ♥
                        </span>

                        <span class="like-text">
                            إعجاب
                        </span>

                        <span class="like-count">
                            0
                        </span>

                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
            SCREENSHOTS
        ================================================= -->

        <section class="screenshots-section">

            <div
                id="screenshots"
                class="screenshots"
            ></div>

        </section>

    </main>


    <!-- =====================================================
        FOOTER
    ===================================================== -->

    <footer class="footer">

        <div class="copyright">
            © 2026 ARCODEX. All rights reserved.
        </div>

    </footer>


    <!-- =====================================================
        JAVASCRIPT
    ===================================================== -->

    <script>

    (() => {

        /*
         * =====================================================
         * CONFIG
         * =====================================================
         */

        const LIKE_API =
            "https://arcodex.emadadeldev.workers.dev/likes";

        const SITE_URL =
            "https://emadadeldev.github.io/arcodex";

        const DEFAULT_IMAGE =
            `${SITE_URL}/assets/logo.png`;


        /*
         * =====================================================
         * URL
         * =====================================================
         */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const slug =
            params.get("game");


        /*
         * No game specified
         */

        if (!slug) {

            showError();

            return;

        }


        /*
         * =====================================================
         * LOAD DATABASE
         * =====================================================
         */

        async function loadGame() {

            try {

                const response =
                    await fetch(
                        "api/database.json",
                        {
                            cache: "force-cache"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const games =
                    await response.json();

                if (!Array.isArray(games)) {

                    throw new Error(
                        "Invalid database"
                    );

                }

                const game =
                    games.find(
                        item =>
                            item.slug === slug
                    );

                if (!game) {

                    showError();

                    return;

                }

                renderGame(game);

            }

            catch (error) {

                console.error(
                    "GAME API:",
                    error
                );

                showError();

            }

        }


        /*
         * =====================================================
         * RENDER GAME
         * =====================================================
         */

        function renderGame(game) {

            /*
             * =================================================
             * SEO
             * =================================================
             */

            updateSEO(game);


            /*
             * =================================================
             * TITLE
             * =================================================
             */

            document
                .querySelector(
                    ".game-heading h1"
                )
                .textContent =
                    game.title || "";


            /*
             * =================================================
             * DEVELOPER
             * =================================================
             */

            document
                .querySelector(
                    ".developer"
                )
                .textContent =
                    game.developer || "";


            /*
             * =================================================
             * PLATFORMS
             * =================================================
             */

            const genres =
                document.querySelector(
                    ".genres"
                );

            genres.replaceChildren();

            if (
                Array.isArray(
                    game.port
                )
            ) {

                const fragment =
                    document.createDocumentFragment();

                for (
                    const port
                    of game.port
                ) {

                    const span =
                        document.createElement(
                            "span"
                        );

                    span.textContent =
                        port;

                    fragment.appendChild(
                        span
                    );

                }

                genres.appendChild(
                    fragment
                );

            }


            /*
             * =================================================
             * COVER
             * =================================================
             */

            const poster =
                document.querySelector(
                    ".poster img"
                );

            poster.src =
                game.cover || "";

            poster.alt =
                game.title || "";


            /*
             * =================================================
             * BLURRED BACKGROUND
             * =================================================
             */

            setGameBackground(
                game.cover
            );


            /*
             * =================================================
             * DESCRIPTION
             * =================================================
             */

            const description =
                document.querySelector(
                    ".description"
                );

            description.textContent =
                game.Description || "";


            /*
             * =================================================
             * SOCIAL LINKS
             * =================================================
             */

            renderSocialLinks(
                game
            );


            /*
             * =================================================
             * SCREENSHOTS
             * =================================================
             */

            renderScreenshots(
                game
            );


            /*
             * =================================================
             * DOWNLOAD
             * =================================================
             */

            const downloadButton =
                document.querySelector(
                    ".download-button"
                );

            if (
                game.downloadble === true &&
                game.downloadlink
            ) {

                downloadButton.style.display =
                    "inline-flex";

                downloadButton.onclick =
                    () => {

                        window.location.href =
                            game.downloadlink;

                    };

            }

            else {

                downloadButton.style.display =
                    "none";

            }


            /*
             * =================================================
             * SHARE
             * =================================================
             */

            setupShareButton(
                game
            );


            /*
             * =================================================
             * LIKE
             * =================================================
             */

            setupLikeButton(
                game
            );

        }


        /*
         * =====================================================
         * GAME BACKGROUND
         * =====================================================
         */

        function setGameBackground(
            imageUrl
        ) {

            const background =
                document.querySelector(
                    ".game-background-image"
                );

            if (
                !background ||
                !imageUrl
            ) {

                return;

            }

            /*
             * Preload image first.
             * This prevents the background from
             * appearing half-loaded.
             */

            const image =
                new Image();

            image.onload =
                () => {

                    background.style.backgroundImage =
                        `url("${imageUrl}")`;

                    requestAnimationFrame(
                        () => {

                            background.classList.add(
                                "visible"
                            );

                        }
                    );

                };

            image.onerror =
                () => {

                    background.classList.remove(
                        "visible"
                    );

                };

            image.src =
                imageUrl;

        }


        /*
         * =====================================================
         * SEO
         * =====================================================
         */

        function updateSEO(
            game
        ) {

            const gameTitle =
                game.title ||
                "ARCODEX";

            const developer =
                game.developer ||
                "";

            const gameDescription =
                cleanDescription(
                    game.Description ||
                    `تعريب لعبة ${gameTitle} باللغة العربية على ARCODEX.`
                );

            const keywords = [
                gameTitle,
                developer,
                `تعريب ${gameTitle}`,
                `ترجمة ${gameTitle}`,
                `${gameTitle} عربي`,
                "تعريبات",
                "تعريب ألعاب",
                "ترجمة ألعاب",
                "ARCODEX"
            ]
                .filter(Boolean)
                .join(", ");

            const gameUrl =
                `${SITE_URL}/game.html?game=${encodeURIComponent(game.slug)}`;

            let gameImage =
                DEFAULT_IMAGE;

            if (game.cover) {

                try {

                    gameImage =
                        new URL(
                            game.cover,
                            window.location.href
                        ).href;

                }

                catch (error) {

                    console.error(
                        "SEO IMAGE:",
                        error
                    );

                }

            }

            document.title =
                `${gameTitle} - ARCODEX`;

            setMeta(
                'meta[name="description"]',
                gameDescription
            );

            setMeta(
                'meta[name="keywords"]',
                keywords
            );

            setLink(
                'link[rel="canonical"]',
                gameUrl
            );

            setMeta(
                'meta[property="og:title"]',
                `${gameTitle} - ARCODEX`
            );

            setMeta(
                'meta[property="og:description"]',
                gameDescription
            );

            setMeta(
                'meta[property="og:url"]',
                gameUrl
            );

            setMeta(
                'meta[property="og:image"]',
                gameImage
            );

            setMeta(
                'meta[property="og:image:alt"]',
                gameTitle
            );

            setMeta(
                'meta[name="twitter:title"]',
                `${gameTitle} - ARCODEX`
            );

            setMeta(
                'meta[name="twitter:description"]',
                gameDescription
            );

            setMeta(
                'meta[name="twitter:image"]',
                gameImage
            );

            setMeta(
                'meta[name="twitter:image:alt"]',
                gameTitle
            );

            updateStructuredData({

                title:
                    gameTitle,

                description:
                    gameDescription,

                url:
                    gameUrl,

                image:
                    gameImage,

                developer:
                    developer,

                platform:
                    Array.isArray(game.port)
                        ? game.port
                        : []

            });

        }


        /*
         * =====================================================
         * SET META
         * =====================================================
         */

        function setMeta(
            selector,
            value
        ) {

            const element =
                document.querySelector(
                    selector
                );

            if (!element) {

                return;

            }

            element.setAttribute(
                "content",
                value
            );

        }


        /*
         * =====================================================
         * SET LINK
         * =====================================================
         */

        function setLink(
            selector,
            value
        ) {

            const element =
                document.querySelector(
                    selector
                );

            if (!element) {

                return;

            }

            element.setAttribute(
                "href",
                value
            );

        }


        /*
         * =====================================================
         * CLEAN DESCRIPTION
         * =====================================================
         */

        function cleanDescription(
            text
        ) {

            return String(text)
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 300);

        }


        /*
         * =====================================================
         * STRUCTURED DATA
         * =====================================================
         */

        function updateStructuredData(
            data
        ) {

            const schema =
                document.querySelector(
                    "#game-schema"
                );

            if (!schema) {

                return;

            }

            const json = {

                "@context":
                    "https://schema.org",

                "@type":
                    "VideoGame",

                "name":
                    data.title,

                "description":
                    data.description,

                "url":
                    data.url,

                "image":
                    data.image,

                "inLanguage":
                    "ar"

            };

            if (data.developer) {

                json.author = {

                    "@type":
                        "Organization",

                    "name":
                        data.developer

                };

            }

            if (
                Array.isArray(
                    data.platform
                ) &&
                data.platform.length
            ) {

                json.gamePlatform =
                    data.platform;

            }

            schema.textContent =
                JSON.stringify(
                    json
                );

        }


        /*
         * =====================================================
         * SHARE
         * =====================================================
         */

        function setupShareButton(
            game
        ) {

            const shareButton =
                document.querySelector(
                    ".magnet-button"
                );

            shareButton.onclick =
                async () => {

                    try {

                        if (
                            navigator.share
                        ) {

                            await navigator.share({

                                title:
                                    game.title,

                                text:
                                    game.Description || "",

                                url:
                                    window.location.href

                            });

                        }

                        else {

                            await navigator.clipboard
                                .writeText(
                                    window.location.href
                                );

                            shareButton.textContent =
                                "تم نسخ الرابط";

                            setTimeout(
                                () => {

                                    shareButton.textContent =
                                        "مشاركة";

                                },
                                2000
                            );

                        }

                    }

                    catch (error) {

                        console.error(
                            "Share:",
                            error
                        );

                    }

                };

        }


        /*
         * =====================================================
         * LIKE
         * =====================================================
         */

        function setupLikeButton(
            game
        ) {

            const likeButton =
                document.querySelector(
                    ".like-button"
                );

            const likeCount =
                likeButton.querySelector(
                    ".like-count"
                );

            const likeText =
                likeButton.querySelector(
                    ".like-text"
                );

            loadLikes(
                game,
                likeCount
            );

            likeButton.onclick =
                async () => {

                    if (
                        likeButton.disabled
                    ) {

                        return;

                    }

                    likeButton.disabled =
                        true;

                    try {

                        const response =
                            await fetch(
                                LIKE_API,
                                {
                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            slug:
                                                game.slug

                                        })

                                }
                            );

                        if (!response.ok) {

                            throw new Error(
                                `HTTP ${response.status}`
                            );

                        }

                        const data =
                            await response.json();

                        likeCount.textContent =
                            data.likes ?? 0;

                        likeButton.classList.add(
                            "liked"
                        );

                        likeText.textContent =
                            "أعجبني";

                    }

                    catch (error) {

                        console.error(
                            "LIKE API:",
                            error
                        );

                    }

                    finally {

                        likeButton.disabled =
                            false;

                    }

                };

        }


        /*
         * =====================================================
         * LOAD LIKES
         * =====================================================
         */

        async function loadLikes(
            game,
            likeCount
        ) {

            try {

                const response =
                    await fetch(
                        `${LIKE_API}?slug=${encodeURIComponent(game.slug)}`,
                        {
                            method:
                                "GET",

                            cache:
                                "no-store"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data =
                    await response.json();

                likeCount.textContent =
                    data.likes ?? 0;

            }

            catch (error) {

                console.error(
                    "LOAD LIKES:",
                    error
                );

                likeCount.textContent =
                    "0";

            }

        }


        /*
         * =====================================================
         * SOCIAL LINKS
         * =====================================================
         */

        function renderSocialLinks(
            game
        ) {

            const container =
                document.querySelector(
                    ".social-links"
                );

            container.replaceChildren();

            if (
                !game.links ||
                typeof game.links !== "object"
            ) {

                return;

            }

            const icons = {

                github: `

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.69-3.88-1.54-3.88-1.54-.53-1.36-1.28-1.72-1.28-1.72-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.73-1.52-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.35.78 1.04.78 2.1v3.11c0 .31.21.67.8.56C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5Z"
                        />

                    </svg>

                `,

                x: `

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M18.244 2.25h3.308l-7.227 8.26L22.827 21.75h-6.617l-5.18-6.773-5.93 6.773H1.79l7.73-8.835L1.173 2.25H7.96l4.682 6.188 5.602-6.188Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"
                        />

                    </svg>

                `

            };

            for (
                const [
                    name,
                    url
                ]
                of Object.entries(
                    game.links
                )
            ) {

                if (
                    !url ||
                    !icons[name]
                ) {

                    continue;

                }

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.title =
                    name.toUpperCase();

                link.setAttribute(
                    "aria-label",
                    name
                );

                link.innerHTML =
                    icons[name];

                container.appendChild(
                    link
                );

            }

        }


        /*
         * =====================================================
         * SCREENSHOTS
         * =====================================================
         */

        function renderScreenshots(
            game
        ) {

            const container =
                document.querySelector(
                    "#screenshots"
                );

            container.replaceChildren();

            if (
                !game.screenshots ||
                typeof game.screenshots !== "object"
            ) {

                return;

            }

            const images =
                Array.isArray(
                    game.screenshots.images
                )
                    ? game.screenshots.images
                    : [];

            const trailer =
                game.screenshots.trailer || "";

            if (
                !images.length &&
                !trailer
            ) {

                return;

            }

            images.forEach(
                (
                    imageUrl,
                    index
                ) => {

                    if (
                        !imageUrl ||
                        typeof imageUrl !== "string"
                    ) {

                        return;

                    }

                    const screenshot =
                        document.createElement(
                            "div"
                        );

                    screenshot.className =
                        "screenshot";

                    if (
                        index === 0 &&
                        trailer
                    ) {

                        const trailerLink =
                            document.createElement(
                                "a"
                            );

                        trailerLink.className =
                            "trailer-button";

                        trailerLink.href =
                            trailer;

                        trailerLink.target =
                            "_blank";

                        trailerLink.rel =
                            "noopener noreferrer";

                        trailerLink.setAttribute(
                            "aria-label",
                            "تشغيل التريلر"
                        );

                        trailerLink.innerHTML = `

                            <span
                                class="btn-play-trailer"
                            ></span>

                        `;

                        screenshot.appendChild(
                            trailerLink
                        );

                    }

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.className =
                        "screenshot-image";

                    link.href =
                        imageUrl;

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.src =
                        imageUrl;

                    image.alt =
                        game.title || "";

                    image.loading =
                        "lazy";

                    image.decoding =
                        "async";

                    link.appendChild(
                        image
                    );

                    screenshot.appendChild(
                        link
                    );

                    container.appendChild(
                        screenshot
                    );

                }
            );

        }


        /*
         * =====================================================
         * ERROR
         * =====================================================
         */

        function showError() {

            const container =
                document.querySelector(
                    ".game-container"
                );

            if (!container) {

                return;

            }

            container.innerHTML = `

                <div class="api-error">

                    اللعبة غير موجودة.

                </div>

            `;

        }


        /*
         * =====================================================
         * START
         * =====================================================
         */


            function setGameBackground(imageUrl) {
                const background = document.querySelector(".game-background-image");

                if (!background || !imageUrl) return;

                const image = new Image();

                image.crossOrigin = "anonymous";

                image.onload = () => {

                    background.style.backgroundImage = `url("${imageUrl}")`;

                    extractCoverColor(image);

                    requestAnimationFrame(() => {
                        background.classList.add("visible");
                    });
                };

                image.onerror = () => {
                    background.classList.remove("visible");
                };

                    image.src = imageUrl;
            }

            function extractCoverColor(image) {

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", {
            willReadFrequently: true
        });

        const size = 40;

        canvas.width = size;
        canvas.height = size;

        ctx.drawImage(image, 0, 0, size, size);

        const data = ctx.getImageData(
            0,
            0,
            size,
            size
        ).data;

        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;

        for (let i = 0; i < data.length; i += 4) {

            const red = data[i];
            const green = data[i + 1];
            const blue = data[i + 2];
            const alpha = data[i + 3];

            if (alpha < 150) continue;

            /*
            * تجاهل الألوان القريبة جدًا من الأسود
            * عشان الـ gradient مايبقاش أسود بالكامل.
            */
            if (
                red < 20 &&
                green < 20 &&
                blue < 20
            ) {
                continue;
            }

            r += red;
            g += green;
            b += blue;

            count++;
        }

        if (!count) return;

        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        /*
        * نخفف اللون شوية عشان يكون مناسب
        * كـ background وليس لون صارخ.
        */
        r = Math.round(r * 0.65);
        g = Math.round(g * 0.65);
        b = Math.round(b * 0.65);

        document.documentElement.style.setProperty(
            "--cover-color",
            `rgb(${r}, ${g}, ${b})`
        );
    }

        loadGame();

    })();
