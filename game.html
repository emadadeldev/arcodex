<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ARCODEX</title>
  <meta name="description" content="ARCODEX - تعريبات الألعاب." />
  <meta name="author" content="Emad Adel" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ARCODEX" />
  <meta property="og:locale" content="ar_AR" />
  <meta property="og:title" content="ARCODEX" />
  <meta property="og:description" content="تعريبات الألعاب." />
  <meta property="og:image" content="assets/logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ARCODEX" />
  <meta name="twitter:description" content="تعريبات الألعاب." />
  <meta name="twitter:image" content="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://arcodex.emadadeldev.workers.dev" />
  <link rel="dns-prefetch" href="//arcodex.emadadeldev.workers.dev" />
  <link rel="preload" as="image" href="assets/logo.png" />


  <script defer src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>


  <script id="game-schema" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "ARCODEX",
        "description": "تعريبات الألعاب",
        "inLanguage": "ar"
      }
    </script>
</head>

<body class="game-page">
  <div class="game-background" aria-hidden="true">
    <div class="game-background-image"></div>
    <div class="game-background-overlay"></div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a href="./" class="logo"> AR<span>CODEX</span> </a>

      <div class="account">
        <a href="./">التعريبات</a>
        <span>|</span>

        <a href="donate.html">الدعم المادي</a>
        <span>|</span>

          <a href="https://discord.gg/j4ctCTgd6S"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-link"
            aria-label="Discord">
            <img src="assets/icons/discord.svg" alt="">
          </a>

          <a href="https://x.com/emadadeldev"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-link"
            aria-label="X">
            <img src="assets/icons/x-twitter.svg" alt="">
          </a>

          <a href="https://github.com/emadadeldev"
            target="_blank"
            rel="noopener noreferrer"
            class="icon-link"
            aria-label="GitHub">
            <img src="assets/icons/github.svg" alt="">
          </a>

      </div>
    </div>
  </header>

  <!-- GAME PAGE -->
  <main class="game-container">
    <div id="game-error" role="alert" hidden style="text-align: center; padding: 40px">
      <h2>تعذر تحميل اللعبة</h2>
      <p id="game-error-message"></p>
      <a href="./">العودة إلى التعريبات</a>
    </div>

    <div id="game-content">
      <section class="game-heading">
        <h1 id="game-title"></h1>
        <div class="developer" id="game-developer"></div>
        <div class="genres" id="game-platforms"></div>
      </section>

      <section class="game-main">
        <div class="poster-column">
          <div class="poster">
            <img id="game-cover" src="assets/logo.png" alt="" loading="eager" />
          </div>
        </div>

        <div class="game-details">
          <div class="description" id="game-description"></div>

          <div class="progress-wrapper">
            <span class="progress-label">شريط اكتمال التعريب</span>
            <progress class="progbar" id="game-progress" value="0" max="100"></progress>
            <span id="game-progress-text">0%</span>
          </div>

          <div class="social-links"></div>

          <div class="download-actions">
            <button class="download-button" id="download-button" type="button">
              تنزيل
            </button>

            <button class="magnet-button" id="share-button" type="button">
              مشاركة
            </button>

            <button class="like-button" id="like-button" type="button" aria-label="إعجاب">
              <span class="like-icon">❤️</span>
              <span class="like-text">إعجاب</span>
              <span class="like-count" id="like-count">0</span>
            </button>
          </div>

          <section class="contributors-section">
            <h2>العاملين على التعريب</h2>
            <div class="contributors" id="game-contributors"></div>
          </section>
        </div>
      </section>

      <section class="screenshots-section">
        <div id="screenshots" class="screenshots"></div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="copyright">
      تم تطوير الموقع وتصميمه بواسطة
      <a href="https://github.com/emadadeldev" target="_blank" rel="noopener noreferrer">ARCODEX</a>
      Emad Adel. All rights reserved 2026
    </div>
  </footer>
  <script src="assets/script.js"></script>
  <script src="assets/noconsole.js"></script>
</body>

</html>
